<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Theory Visualizer | การเป็นสมาชิก สับเซต และพาวเวอร์เซต</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .element-chip {
            transition: all 0.2s ease-in-out;
        }
        .element-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .element-chip:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-6 shadow-md">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold mb-2">✨ Set Theory Visualizer</h1>
            <p class="text-indigo-200">เรียนรู้เรื่อง สมาชิก, สับเซต และ พาวเวอร์เซต แบบเห็นภาพ</p>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-4xl mx-auto w-full flex flex-col gap-6">
        
        <!-- Input Section -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-end mb-2">
                <label for="set-input" class="block text-sm font-semibold text-slate-700">1. กำหนดเซตตั้งต้น (คั่นสมาชิกด้วยเครื่องหมายลูกน้ำ ,)</label>
                <button onclick="copyEmptySet()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 transition-colors flex items-center gap-1 shadow-sm">
                    <span>คัดลอก ∅ (เซตว่าง)</span>
                    <span id="copy-feedback" class="text-emerald-500 hidden font-bold">✓</span>
                </button>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl font-medium text-slate-400">{</span>
                <input type="text" id="set-input" value="1, 2, 3" 
                    class="w-full text-lg border-b-2 border-indigo-200 focus:border-indigo-500 outline-none py-1 px-2 transition-colors text-center font-medium"
                    placeholder="เช่น 1, 2, 3 หรือ a, b, c">
                <span class="text-2xl font-medium text-slate-400">}</span>
            </div>
            <p id="warning-msg" class="text-amber-500 text-sm mt-2 hidden">แนะนำให้ใส่สมาชิกไม่เกิน 5 ตัว เพื่อไม่ให้อนิเมชันพาวเวอร์เซตยาวเกินไปครับ</p>
        </section>

        <!-- Mode Selection -->
        <section class="flex flex-wrap gap-3 justify-center">
            <button onclick="setMode('membership')" id="btn-membership" class="px-6 py-3 rounded-full font-medium text-sm md:text-base transition-all bg-indigo-100 text-indigo-700 hover:bg-indigo-200 border-2 border-indigo-200 ring-2 ring-indigo-500 ring-offset-2">
                ∈ สมาชิก (Membership)
            </button>
            <button onclick="setMode('subset')" id="btn-subset" class="px-6 py-3 rounded-full font-medium text-sm md:text-base transition-all bg-white text-slate-600 hover:bg-slate-100 border-2 border-slate-200">
                ⊂ สับเซต (Subset)
            </button>
            <button onclick="setMode('powerset')" id="btn-powerset" class="px-6 py-3 rounded-full font-medium text-sm md:text-base transition-all bg-white text-slate-600 hover:bg-slate-100 border-2 border-slate-200">
                P(A) พาวเวอร์เซต
            </button>
        </section>

        <!-- Interactive Workspace -->
        <section class="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 min-h-[300px] flex flex-col relative overflow-hidden">
            
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <!-- Description -->
                <div id="mode-description" class="text-center md:text-left text-slate-500 text-sm bg-slate-50 p-3 rounded-xl flex-grow w-full">
                    คลิกเลือกสมาชิกด้านล่าง เพื่อดูการเขียนสัญลักษณ์การเป็น <b>สมาชิก (∈)</b>
                </div>
                
                <!-- Live Preview Button -->
                <button onclick="openLivePreview()" class="whitespace-nowrap px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-xl font-medium text-sm flex items-center gap-2 border border-indigo-200 transition-all hover:shadow-md w-full md:w-auto justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    แยกหน้าต่าง Preview
                </button>
            </div>

            <!-- Mathematical Equation Display Area -->
            <div id="equation-display" class="flex-grow flex items-center justify-center flex-wrap gap-3 text-2xl md:text-4xl font-medium text-slate-800 min-h-[120px] p-4 bg-slate-50 rounded-2xl mb-8 border-2 border-dashed border-slate-200">
                <!-- Content will be injected by JS -->
            </div>

            <!-- Element Pool (For picking) -->
            <div id="interactive-controls" class="mt-auto">
                <p class="text-center text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">จิ้มเพื่อหยิบสมาชิก</p>
                <div id="element-pool" class="flex flex-wrap justify-center gap-3">
                    <!-- Chips will be injected by JS -->
                </div>
            </div>

            <!-- Power Set Controls (Hidden by default) -->
            <div id="powerset-controls" class="hidden mt-auto flex justify-center">
                <button onclick="startPowerSetAnimation()" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-full shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    เริ่มสร้างพาวเวอร์เซต
                </button>
            </div>

        </section>
    </main>

    <footer class="text-center p-4 text-slate-400 text-sm mt-auto">
        Interactive Math Visualizer
    </footer>

    <script>
        let currentMode = 'membership'; // 'membership', 'subset', 'powerset'
        let mainSet = [];
        let selectedElements = new Set();
        let currentAnimationId = 0; // ใช้เพื่อจัดการหยุดอนิเมชันหากเปลี่ยนโหมดกะทันหัน
        let previewWindow = null;

        // ฟังก์ชันหน่วงเวลาสำหรับสร้างอนิเมชัน
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        const inputEl = document.getElementById('set-input');
        const poolEl = document.getElementById('element-pool');
        const displayEl = document.getElementById('equation-display');
        const descEl = document.getElementById('mode-description');
        const interactiveControls = document.getElementById('interactive-controls');
        const powersetControls = document.getElementById('powerset-controls');
        const warningMsg = document.getElementById('warning-msg');

        function copyEmptySet() {
            const textArea = document.createElement("textarea");
            textArea.value = "∅";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 1500);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function openLivePreview() {
            if (previewWindow && !previewWindow.closed) {
                previewWindow.focus();
                return;
            }
            
            previewWindow = window.open('', 'LivePreview', 'width=800,height=500,menubar=no,toolbar=no,location=no,status=no');
            
            previewWindow.document.write(`
                <!DOCTYPE html>
                <html lang="th">
                <head>
                    <meta charset="UTF-8">
                    <title>Live Preview | Set Theory Visualizer</title>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Kanit', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc; margin: 0; padding: 20px;}
                        .preview-container { padding: 2rem; background: white; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); width: 100%; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;}
                        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
                        @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
                    </style>
                </head>
                <body>
                    <div class="preview-container text-2xl md:text-5xl font-medium text-slate-800" id="live-content">
                        ${displayEl.innerHTML}
                    </div>
                </body>
                </html>
            `);
            previewWindow.document.close();
            
            // Listen for window close event to clean up reference
            previewWindow.onbeforeunload = () => {
                previewWindow = null;
            };
        }

        function updateLivePreview() {
            if (previewWindow && !previewWindow.closed) {
                const targetEl = previewWindow.document.getElementById('live-content');
                if (targetEl) {
                    targetEl.innerHTML = displayEl.innerHTML;
                    // Auto scroll to bottom if needed (e.g., during powerset generation)
                    previewWindow.scrollTo({ top: previewWindow.document.body.scrollHeight, behavior: 'smooth' });
                }
            }
        }

        function parseInput() {
            const rawValue = inputEl.value;
            // Split by comma, trim whitespace, remove empty strings
            mainSet = rawValue.split(',').map(s => s.trim()).filter(s => s !== '');
            // Remove duplicates
            mainSet = [...new Set(mainSet)];
            
            if(mainSet.length > 5) {
                warningMsg.classList.remove('hidden');
            } else {
                warningMsg.classList.add('hidden');
            }

            // Reset selections when set changes
            selectedElements.clear();
            renderPool();
            renderDisplay();
        }

        inputEl.addEventListener('input', parseInput);

        function setMode(mode) {
            currentMode = mode;
            selectedElements.clear();
            currentAnimationId++; // รีเซ็ต/หยุด อนิเมชันพาวเวอร์เซตที่กำลังวิ่งอยู่

            // Update button styles
            const buttons = ['membership', 'subset', 'powerset'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-${b}`);
                if (b === mode) {
                    btn.className = "px-6 py-3 rounded-full font-medium text-sm md:text-base transition-all bg-indigo-100 text-indigo-700 hover:bg-indigo-200 border-2 border-indigo-200 ring-2 ring-indigo-500 ring-offset-2 pop-in";
                } else {
                    btn.className = "px-6 py-3 rounded-full font-medium text-sm md:text-base transition-all bg-white text-slate-600 hover:bg-slate-100 border-2 border-slate-200";
                }
            });

            // Update Descriptions & Controls
            if (mode === 'membership') {
                descEl.innerHTML = "คลิกเลือกสมาชิกด้านล่าง เพื่อนำไปตั้งด้านซ้าย <br><b>การเป็นสมาชิก (∈)</b>: ไม่ต้องใส่ปีกกาครอบตัวมัน";
                interactiveControls.classList.remove('hidden');
                powersetControls.classList.add('hidden');
            } else if (mode === 'subset') {
                descEl.innerHTML = "คลิกเลือกสมาชิกด้านล่าง เพื่อสร้างเซตใหม่ <br><b>สับเซต (⊂)</b>: ต้องเอาปีกกา { } มาครอบสมาชิกที่เลือกไว้";
                interactiveControls.classList.remove('hidden');
                powersetControls.classList.add('hidden');
            } else if (mode === 'powerset') {
                descEl.innerHTML = "<b>พาวเวอร์เซต P(เซต)</b> คือ เซตที่รวบรวม 'สับเซตที่เป็นไปได้ทั้งหมด' ของเซตนั้นๆ <br>กดปุ่มด้านล่างเพื่อดูอนิเมชัน";
                interactiveControls.classList.add('hidden');
                powersetControls.classList.remove('hidden');
            }

            renderPool();
            renderDisplay();
        }

        function renderPool() {
            if (currentMode === 'powerset') return; // Not used in powerset

            poolEl.innerHTML = '';
            if (mainSet.length === 0) {
                poolEl.innerHTML = '<span class="text-slate-400 italic">กรุณากำหนดสมาชิกในเซตตั้งต้น</span>';
                return;
            }

            mainSet.forEach(el => {
                const isSelected = selectedElements.has(el);
                const btn = document.createElement('button');
                
                // Styling based on selection state
                if (isSelected) {
                    btn.className = "element-chip px-4 py-2 rounded-lg font-bold text-lg bg-indigo-500 text-white shadow-md border-2 border-indigo-600";
                } else {
                    btn.className = "element-chip px-4 py-2 rounded-lg font-bold text-lg bg-white text-slate-700 border-2 border-slate-300 hover:border-indigo-400";
                }
                
                btn.innerText = el;
                btn.onclick = () => toggleElement(el);
                poolEl.appendChild(btn);
            });
        }

        function toggleElement(el) {
            if (selectedElements.has(el)) {
                selectedElements.delete(el);
            } else {
                selectedElements.add(el);
            }
            renderPool();
            renderDisplay();
        }

        function renderDisplay() {
            currentAnimationId++; // หยุดอนิเมชันเดิมถ้ามีการปรับแก้
            
            if (mainSet.length === 0) {
                displayEl.innerHTML = '<span class="text-slate-300">รอข้อมูล...</span>';
                return;
            }

            const mainSetString = `{ ${mainSet.join(', ')} }`;
            const selectedArray = Array.from(selectedElements);

            if (currentMode === 'membership') {
                if (selectedArray.length === 0) {
                    displayEl.innerHTML = `<span class="text-slate-300 italic text-lg">? ∈ ${mainSetString}</span>`;
                } else {
                    // Just comma separated, no curly braces
                    const leftSide = selectedArray.join(', ');
                    displayEl.innerHTML = `
                        <div class="flex items-center gap-4 pop-in">
                            <span class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-xl">${leftSide}</span>
                            <span class="text-slate-400">∈</span>
                            <span>${mainSetString}</span>
                        </div>
                    `;
                }
            } 
            else if (currentMode === 'subset') {
                if (selectedArray.length === 0) {
                    displayEl.innerHTML = `<span class="text-slate-300 italic text-lg">{ ? } ⊂ ${mainSetString}</span><br><span class="text-sm text-slate-400 w-full text-center mt-2">(หรือ ∅ ⊂ ${mainSetString})</span>`;
                } else {
                    // Wrap in curly braces
                    const leftSide = `{ ${selectedArray.join(', ')} }`;
                    displayEl.innerHTML = `
                        <div class="flex items-center gap-4 pop-in">
                            <span class="text-emerald-600 font-bold bg-emerald-50 px-4 py-2 rounded-xl border-2 border-emerald-200">${leftSide}</span>
                            <span class="text-slate-400">⊂</span>
                            <span>${mainSetString}</span>
                        </div>
                    `;
                }
            }
            else if (currentMode === 'powerset') {
                 displayEl.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-purple-600 font-bold">P(${mainSetString})</span>
                        <span class="text-slate-400">=</span>
                        <span class="text-slate-300 italic text-lg">รอการสร้าง...</span>
                    </div>
                `;
            }
            
            updateLivePreview();
        }

        function getSubsets(array) {
            const subsets = [[]];
            for (const el of array) {
                const last = subsets.length;
                for (let i = 0; i < last; i++) {
                    subsets.push([...subsets[i], el]);
                }
            }
            // Sort by length for logical presentation
            return subsets.sort((a, b) => a.length - b.length);
        }

        function formatSubset(subsetArr) {
            if (subsetArr.length === 0) return '∅'; // Empty set symbol
            return `{${subsetArr.join(',')}}`;
        }

        async function startPowerSetAnimation() {
            // สร้าง ID อนิเมชันรอบนี้ ป้องกันการกดปุ่มรัวๆ หรือเปลี่ยนโหมดแล้วอนิเมชันตีกัน
            currentAnimationId++;
            const myAnimId = currentAnimationId;

            powersetControls.querySelector('button').disabled = true;
            powersetControls.querySelector('button').classList.add('opacity-50', 'cursor-not-allowed');

            const subsets = getSubsets(mainSet);
            const mainSetString = `{ ${mainSet.join(', ')} }`;
            
            // เตรียมหน้าตา UI แบ่งเป็น 2 ขั้นตอน
            displayEl.innerHTML = `
                <div class="w-full flex flex-col gap-6 text-left overflow-y-auto max-h-[60vh] pr-2 pb-4">
                    
                    <!-- ขั้นที่ 1 -->
                    <div id="phase1-container" class="w-full flex flex-col gap-3">
                        <h3 class="text-lg font-bold text-slate-600 mb-2 border-b-2 border-slate-200 pb-2">1. แยกหาสับเซตตามจำนวนสมาชิก</h3>
                        <!-- กลุ่มสับเซตจะโผล่ตรงนี้ -->
                    </div>
                    
                    <!-- ขั้นที่ 2 -->
                    <div id="phase2-container" class="hidden flex-col items-center gap-4 mt-4 pt-6 border-t-2 border-slate-200 fade-in-up">
                        <h3 class="text-lg font-bold text-purple-600 text-center">2. รวบรวมสับเซตทั้งหมด นำมาใส่เซตครอบ (พาวเวอร์เซต)</h3>
                        <div class="flex flex-wrap items-center justify-center gap-2 text-xl md:text-2xl leading-loose bg-white p-4 rounded-2xl shadow-sm border border-purple-100 w-full">
                            <span class="text-purple-700 font-bold">P(${mainSetString}) = </span>
                            <span class="text-purple-700 font-bold text-3xl">{</span>
                            <div id="final-powerset-items" class="flex flex-wrap items-center justify-center gap-2"></div>
                            <span id="final-powerset-close" class="text-purple-700 font-bold text-3xl opacity-0 transition-opacity">}</span>
                        </div>
                        <div id="powerset-counter" class="hidden text-sm font-bold text-purple-600 bg-purple-100 px-4 py-2 rounded-full pop-in">
                            มีสมาชิกทั้งหมด 2<sup>${mainSet.length}</sup> = ${subsets.length} ตัว
                        </div>
                    </div>

                </div>
            `;

            const phase1 = document.getElementById('phase1-container');
            const phase2 = document.getElementById('phase2-container');
            const finalItems = document.getElementById('final-powerset-items');
            const finalClose = document.getElementById('final-powerset-close');
            const counter = document.getElementById('powerset-counter');
            const scrollArea = displayEl.querySelector('.overflow-y-auto');

            // จัดกลุ่มสับเซตตามความยาวล่วงหน้า
            const groupedSubsets = {};
            subsets.forEach(sub => {
                const len = sub.length;
                if(!groupedSubsets[len]) groupedSubsets[len] = [];
                groupedSubsets[len].push(sub);
            });

            // --- เริ่มแสดงผล ขั้นที่ 1: โชว์เป็นกลุ่มๆ ---
            for (let i = 0; i <= mainSet.length; i++) {
                if (myAnimId !== currentAnimationId) return; // ยกเลิกถ้ามีการสั่งหยุด
                if (!groupedSubsets[i]) continue;

                const groupDiv = document.createElement('div');
                groupDiv.className = "flex flex-col md:flex-row md:items-center gap-3 pop-in bg-white p-3 rounded-xl shadow-sm border border-slate-100";
                groupDiv.innerHTML = `<div class="md:w-36 font-semibold text-slate-500 shrink-0 text-sm md:text-base">สมาชิก ${i} ตัว:</div> <div class="flex flex-wrap gap-2 group-items"></div>`;
                phase1.appendChild(groupDiv);
                
                const itemsDiv = groupDiv.querySelector('.group-items');

                for (const subset of groupedSubsets[i]) {
                    if (myAnimId !== currentAnimationId) return;
                    
                    await sleep(250); // ความเร็วในการขึ้นทีละตัว
                    const span = document.createElement('span');
                    span.className = "pop-in inline-block bg-slate-50 border border-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-base md:text-lg font-medium";
                    span.innerText = formatSubset(subset);
                    itemsDiv.appendChild(span);
                    
                    // เลื่อนหน้าจออัตโนมัติ
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                    updateLivePreview();
                }
                await sleep(400); // พักรอก่อนขึ้นกลุ่มถัดไป
            }

            if (myAnimId !== currentAnimationId) return;

            // --- เริ่มแสดงผล ขั้นที่ 2: รวมเป็นพาวเวอร์เซต ---
            await sleep(800);
            phase2.classList.remove('hidden');
            phase2.classList.add('flex');
            scrollArea.scrollTop = scrollArea.scrollHeight;
            updateLivePreview();

            await sleep(1000); // ให้ผู้เรียนได้อ่านหัวข้อที่ 2 ก่อน
            
            let subsetIndex = 0;
            for (let i = 0; i <= mainSet.length; i++) {
                if (!groupedSubsets[i]) continue;
                for (const subset of groupedSubsets[i]) {
                    if (myAnimId !== currentAnimationId) return;

                    await sleep(200); // ความเร็วตอนรวบรวม
                    
                    const span = document.createElement('span');
                    span.className = "pop-in inline-block bg-purple-50 border-2 border-purple-300 text-purple-800 px-2 py-1 rounded-md shadow-sm text-lg md:text-xl font-medium mx-1";
                    
                    if (subsetIndex > 0) {
                        const comma = document.createElement('span');
                        comma.innerText = ', ';
                        comma.className = "text-slate-400 font-bold";
                        finalItems.appendChild(comma);
                    }

                    span.innerText = formatSubset(subset);
                    finalItems.appendChild(span);
                    
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                    updateLivePreview();
                    subsetIndex++;
                }
            }

            if (myAnimId !== currentAnimationId) return;

            // ปิดปีกกา
            await sleep(400);
            finalClose.classList.remove('opacity-0');
            counter.classList.remove('hidden');
            updateLivePreview();

            // เปิดปุ่มให้กดใหม่ได้
            powersetControls.querySelector('button').disabled = false;
            powersetControls.querySelector('button').classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // Initialize
        parseInput();
        setMode('membership');

    </script>
</body>
</html>
